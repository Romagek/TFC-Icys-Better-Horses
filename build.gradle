plugins { id 'net.neoforged.moddev' version '2.0.78' }
version = '0.1.6'
group = 'com.gregnautics'
base { archivesName = 'tfc-icys-better-horses' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    runs {
        server { server(); programArgument '--nogui'; if (project.hasProperty('qa')) systemProperty 'tfci.qa', 'true' }
        client { client() }
    }
    if (!project.hasProperty('packagedTest')) mods { tfc_icy_horses { sourceSet sourceSets.main } }
}
def packMods = file(findProperty('packMods') ?: 'C:/Users/romag/curseforge/minecraft/Instances/Gregnautics (1)/mods')
repositories { mavenCentral() }
dependencies {
    if (project.hasProperty('packagedTest')) runtimeOnly files("build/libs/tfc-icys-better-horses-${version}.jar")
    compileOnly fileTree(dir: packMods, includes: ['TerraFirmaCraft-*.jar','icys-better-horses-*.jar','geckolib-*.jar','trotting_wagons-*.jar','astikorcartsredux-*.jar','createhorsepower-*.jar','gregnautics-core-*.jar'])
    // Test runtime uses the exact pack files, never a modified original JAR.
    runtimeOnly fileTree(dir: packMods, includes: project.hasProperty('fullPack') ? ['*.jar'] : [
        'TerraFirmaCraft-*.jar','Patchouli-*.jar','icys-better-horses-*.jar','modonomicon-*.jar',
        'geckolib-*.jar','architectury-*.jar','cloth-config-*.jar','curios-neoforge-*.jar',
        'trotting_wagons-*.jar','astikorcartsredux-*.jar','TFCAstikorCarts-*.jar','TFCRegistryAPI-*.jar',
        'create-1.21.1-*.jar','createhorsepower-*.jar','horsescanswim-*.jar','Jade-*.jar'])
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
if (project.hasProperty('packagedTest')) {
    afterEvaluate {
        tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
            def originalClasspath = files(new ArrayList(classpathProvider.from))
            classpathProvider.setFrom(originalClasspath.filter { !sourceSets.main.output.files.contains(it) })
        }
    }
}
